<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360" style="background:#090d16;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;overflow:hidden"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0c1021"/><stop offset="50%" stop-color="#0e172e"/><stop offset="100%" stop-color="#141029"/></linearGradient><linearGradient id="purpleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="cyanGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="cardGlow" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".1"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseAnim{0%{transform:scale(.92);opacity:.35}}@keyframes floatBadge{0%{transform:translateY(0)}}@keyframes floatBadgeRev{0%{transform:translateY(0)}}.flow-line{stroke-dasharray:8 12;animation:dashFlow 16s linear infinite}.pulse-orb{animation:pulseAnim 4s ease-in-out infinite alternate}.float-badge{animation:floatBadge 5s ease-in-out infinite alternate}.float-badge-rev{animation:floatBadgeRev 6s ease-in-out infinite alternate}</style><rect width="1200" height="360" fill="url(#bgGrad)"/><circle cx="150" cy="80" r="140" fill="#6366f1" class="pulse-orb" filter="url(#glow)" opacity=".12"/><circle cx="1080" cy="280" r="160" fill="#a855f7" class="pulse-orb" filter="url(#glow)" opacity=".12"/><circle cx="950" cy="80" r="100" fill="#06b6d4" filter="url(#glow)" opacity=".1"/><g f