<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; overflow:hidden;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1021"/>
      <stop offset="50%" stop-color="#0e172e"/>
      <stop offset="100%" stop-color="#141029"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Filter for glowing nodes -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    /* Animated flowing dashed lines */
    .flow-line {
      stroke-dasharray: 8 12;
      animation: dashFlow 16s linear infinite;
    }
    @keyframes dashFlow {
      to {
        stroke-dashoffset: -200;
      }
    }

    /* Subtle pulsing elements */
    .pulse-orb {
      animation: pulseAnim 4s ease-in-out infinite alternate;
    }
    @keyframes pulseAnim {
      0% { transform: scale(0.92); opacity: 0.35; }
      100% { transform: scale(1.08); opacity: 0.7; }
    }

    .float-badge {
      animation: floatBadge 5s ease-in-out infinite alternate;
    }
    @keyframes floatBadge {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }

    .float-badge-rev {
      animation: floatBadgeRev 6s ease-in-out infinite alternate;
    }
    @keyframes floatBadgeRev {
      0% { transform: translateY(0px); }
      100% { transform: translateY(8px); }
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>

  <!-- Background Decorative Glowing Spheres -->
  <circle cx="150" cy="80" r="140" fill="#6366f1" opacity="0.12" filter="url(#glow)" class="pulse-orb"/>
  <circle cx="1080" cy="280" r="160" fill="#a855f7" opacity="0.12" filter="url(#glow)" class="pulse-orb"/>
  <circle cx="950" cy="80" r="100" fill="#06b6d4" opacity="0.1" filter="url(#glow)"/>

  <!-- Flow Circuit Paths (Background Automation Flow) -->
  <g fill="none" opacity="0.4">
    <path d="M 80 180 Q 300 60, 600 180 T 1120 180" stroke="#6366f1" stroke-width="2" class="flow-line"/>
    <path d="M 120 240 Q 400 320, 700 210 T 1100 240" stroke="#a855f7" stroke-width="1.5" class="flow-line" style="animation-direction:reverse;"/>
  </g>

  <!-- Subtle Dynamic Orbiting / Floating Info Pills in Background (Z-index behind title) -->
  <g class="float-badge" opacity="0.65">
    <rect x="90" y="38" width="160" height="32" rx="16" fill="url(#cardGlow)" stroke="#6366f1" stroke-width="1"/>
    <circle cx="108" cy="54" r="5" fill="#10b981"/>
    <text x="122" y="59" fill="#e2e8f0" font-size="12" font-weight="600">Recurring Billing</text>
  </g>

  <g class="float-badge-rev" opacity="0.65">
    <rect x="950" y="42" width="165" height="32" rx="16" fill="url(#cardGlow)" stroke="#a855f7" stroke-width="1"/>
    <circle cx="968" cy="58" r="5" fill="#38bdf8"/>
    <text x="982" y="63" fill="#e2e8f0" font-size="12" font-weight="600">Usage Metering</text>
  </g>

  <g class="float-badge" opacity="0.65">
    <rect x="980" y="280" width="140" height="32" rx="16" fill="url(#cardGlow)" stroke="#ec4899" stroke-width="1"/>
    <circle cx="998" cy="296" r="5" fill="#f43f5e"/>
    <text x="1012" y="301" fill="#e2e8f0" font-size="12" font-weight="600">MoR &amp; Invoicing</text>
  </g>

  <g class="float-badge-rev" opacity="0.65">
    <rect x="80" y="280" width="150" height="32" rx="16" fill="url(#cardGlow)" stroke="#06b6d4" stroke-width="1"/>
    <circle cx="98" cy="296" r="5" fill="#a855f7"/>
    <text x="112" y="301" fill="#e2e8f0" font-size="12" font-weight="600">Open-Source Core</text>
  </g>

  <!-- Foreground Title and Content (Highest Priority, fully clear & centered) -->
  <g text-anchor="middle">
    <!-- Category Pill -->
    <rect x="440" y="45" width="320" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="600" y="64" fill="#a5b4fc" font-size="12" font-weight="700" letter-spacing="1.5">CURATED AWESOME ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="600" y="140" fill="#ffffff" font-size="44" font-weight="800" letter-spacing="-0.5">
      Subscription Management
    </text>
    <text x="600" y="195" fill="url(#purpleGrad)" font-size="44" font-weight="800" letter-spacing="-0.5">
      &amp; Recurring Billing
    </text>

    <!-- Subtitle / Description -->
    <text x="600" y="245" fill="#94a3b8" font-size="16" font-weight="400">
      The authoritative landscape of SaaS platforms, Merchants of Record, &amp; open-source billing engines.
    </text>

    <!-- Metrics / Tags Highlight -->
    <g transform="translate(360, 280)">
      <text x="0" y="0" fill="#38bdf8" font-size="13" font-weight="600">⚡ Automated Invoicing</text>
      <text x="160" y="0" fill="#cbd5e1" font-size="13">•</text>
      <text x="240" y="0" fill="#ec4899" font-size="13" font-weight="600">🔄 Lifecycle &amp; Dunning</text>
      <text x="400" y="0" fill="#cbd5e1" font-size="13">•</text>
      <text x="480" y="0" fill="#a855f7" font-size="13" font-weight="600">📊 Consumption Metering</text>
    </g>
  </g>
</svg>
